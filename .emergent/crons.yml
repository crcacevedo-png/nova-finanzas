crons:
  - name: respaldo-semanal
    description: "Respaldo automatico semanal de toda la base de datos (domingos 06:00 Guatemala)"
    cron: "0 6 * * 0"
    timezone: "America/Guatemala"
    endpoint: "{{BASE_URL}}/api/cron/backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: gcal-sync
    description: "Sincroniza las citas con Google Calendar cada 15 minutos (pull de eventos)"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/google-calendar-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
