[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    slow: marca tests lentos
    integration: marca tests de integración
    e2e: marca tests end-to-end
    auth: marca tests relacionados con autenticación
    pos: marca tests del Punto de Venta
    inventario: marca tests del módulo de inventario
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
